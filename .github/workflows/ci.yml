name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CoinoLive.sln

      - name: Build
        run: dotnet build CoinoLive.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CoinoLive.sln --configuration Release --no-build --verbosity normal
