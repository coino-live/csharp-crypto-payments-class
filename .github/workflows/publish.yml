name: Publish to NuGet

# Run by hand from the Actions tab (or on a new version tag). nuget.org trusts this workflow directly
# (Trusted Publishing policy for the account "coinolive"): a short-lived key is issued per run, nothing is stored.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        run: dotnet test --configuration Release
      - name: Pack
        run: dotnet pack src/CoinoLive/CoinoLive.csproj --configuration Release --output out
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: coinolive
      - name: Push
        run: dotnet nuget push out/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
